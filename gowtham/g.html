<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Management</title>
    <link rel="stylesheet" href="e.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

    <div class="container">
        <h1>Leave Request Form</h1>
        <form id="leaveForm" action="process.php" method="POST" autocomplete="off">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="roll_number">Roll Number:</label>
            <input type="text" id="roll_number" name="roll_number" required pattern="\d+" title="Roll number must be numeric">

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="start_date">Start Date:</label>
            <input type="date" id="start_date" name="start_date" required>

            <label for="end_date">End Date:</label>
            <input type="date" id="end_date" name="end_date" required>

            <label for="reason">Reason:</label>
            <textarea id="reason" name="reason" required></textarea>

            <label for="status">Approval Status:</label>
            <select id="status" name="status" required>
                <option value="Pending" selected>Pending</option>
                <option value="Approved">Approved</option>
                <option value="Not Approved">Not Approved</option>
            </select>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        (function () {

        })();

    document.getElementById("start_date").setAttribute("min", today);
    document.getElementById("end_date").setAttribute("min", today);

    let emailSent = false; // Flag to track if email is sent

    document.getElementById("leaveForm").addEventListener("submit", function(event) {
        event.preventDefault(); // Prevent default submission
        
        if (emailSent) {
            alert("Your leave request has already been submitted.");
            return;
        }

        let name = document.getElementById("name").value;
        let rollNumber = document.getElementById("roll_number").value;
        let email = document.getElementById("email").value;
        let startDate = document.getElementById("start_date").value;
        let endDate = document.getElementById("end_date").value;
        let reason = document.getElementById("reason").value;
        let status = document.getElementById("status").value;

        if (startDate > endDate) {
            alert("Error: Start date cannot be later than end date.");
            return;
        }

        let todayDate = new Date().toISOString().split("T")[0]; // Get today's date

        let emailMessage = `Hello,\n\n${name} (Roll No: ${rollNumber}) has submitted a leave request from ${startDate} to ${endDate}.\n\nReason: ${reason}\nApproval Status: ${status}\n\nThank you.`;

        if (endDate < todayDate) {
            emailMessage = `Hello ${name},\n\nYour leave period from ${startDate} to ${endDate} has ended. Please return to college as soon as possible.\n\nThank you.`;
        }

                console.log("Email sent successfully!", response);
                alert("Leave request submitted and an email notification has been sent.");
                document.getElementById("leaveForm").submit(); // Submit form after email is sent
            }, function(error) {

                alert("Leave request submitted, but email failed to send.");

        }
    });
});

</body>
</html>
